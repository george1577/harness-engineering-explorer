[project]
name = "harness-engineering-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for learning how an agent harness wraps a language model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "openai>=2.8",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
